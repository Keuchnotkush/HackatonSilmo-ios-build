# Builds the private Keuchnotkush/Sous app (Maverick Sport cooking companion) for iOS and uploads it to
# TestFlight. Same rules as ios-testflight.yml: this repo is public and holds no app code; the source is
# checked out with a read-only deploy key, everything sensitive lives in Actions secrets.
#   - manual trigger only (people with write access); fork pull requests never see secrets;
#   - no upload-artifact step: the .ipa bundles sdk.key and anyone can download public artifacts;
#   - no step prints a secret, decoded or not (logs are public).
# Secrets: SOUS_DEPLOY_KEY, SOUS_SDK_KEY_B64 (Maverick Sport key), and the App Store Connect ones shared
# with ios-testflight.yml (APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8_B64).
name: Sous iOS → TestFlight

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit of Keuchnotkush/Sous to build
        default: main
        required: true
      check_only:
        description: Only compile (Kotlin + Swift, simulator build, no signing, no secrets but the deploy key)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: sous-testflight
  cancel-in-progress: false

env:
  PROJECT: iosApp/Sous.xcodeproj
  SCHEME: Sous

jobs:
  # Fast feedback: compiles the shared Kotlin, the Swift glasses driver and the Everysight package.
  check:
    if: ${{ inputs.check_only }}
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - name: Check out app source (private, read-only deploy key)
        uses: actions/checkout@v4
        with:
          repository: Keuchnotkush/Sous
          ref: ${{ inputs.ref }}
          ssh-key: ${{ secrets.SOUS_DEPLOY_KEY }}
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('build.gradle.kts', 'settings.gradle.kts') }}

      - name: Build for the iOS simulator, unsigned
        run: |
          # The project lists sdk.key as a resource: an empty stand-in is enough to compile.
          touch iosApp/Sous/sdk.key
          xcodebuild build \
            -project "$PROJECT" -scheme "$SCHEME" -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

  testflight:
    if: ${{ !inputs.check_only }}
    # Apple only accepts uploads built with the current major iOS SDK (Xcode 26 since April 2026).
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Check out app source (private, read-only deploy key)
        uses: actions/checkout@v4
        with:
          repository: Keuchnotkush/Sous
          ref: ${{ inputs.ref }}
          ssh-key: ${{ secrets.SOUS_DEPLOY_KEY }}
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('build.gradle.kts', 'settings.gradle.kts') }}

      - name: Install secrets into the build
        env:
          SDK_KEY_B64: ${{ secrets.SOUS_SDK_KEY_B64 }}
          ASC_KEY_P8_B64: ${{ secrets.ASC_KEY_P8_B64 }}
        run: |
          printf '%s' "$SDK_KEY_B64" | base64 --decode > iosApp/Sous/sdk.key
          printf '%s' "$ASC_KEY_P8_B64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 iosApp/Sous/sdk.key "$RUNNER_TEMP/AuthKey.p8"
          test -s iosApp/Sous/sdk.key       || { echo "::error::SOUS_SDK_KEY_B64 secret is missing or empty"; exit 1; }
          test -s "$RUNNER_TEMP/AuthKey.p8" || { echo "::error::ASC_KEY_P8_B64 secret is missing or empty"; exit 1; }
          xcodebuild -version

      - name: Archive (Kotlin framework + app, cloud-managed signing)
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild archive \
            -project "$PROJECT" -scheme "$SCHEME" -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/app.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}"

      - name: Export and upload to TestFlight
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/app.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "Uploaded Sous build ${{ github.run_number }}. It appears in TestFlight after Apple's processing (5-15 min)." >> "$GITHUB_STEP_SUMMARY"

      - name: Remove secrets from the runner
        if: always()
        run: rm -rf iosApp/Sous/sdk.key "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/app.xcarchive" "$RUNNER_TEMP/export"
